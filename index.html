<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog tech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        /* Cabeçalho com fundo azul escuro */
        .cabecalho {
            background-color: #0a2351;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
        }
        .imagem-post {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            display: block;
        }
    </style>
</head>
<body>

    <header class="cabecalho">
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <article>
            <h2>Meu primeiro post</h2>
            <p><strong>Por:</strong> Isaac Thomas</p>

            <!-- Imagem com link direto da internet, funciona sem arquivo na pasta -->
            <img 
                src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" 
                alt="Ícone de livro aberto com elementos de tecnologia e rede, representando aprendizado em programação"
                class="imagem-post"
            >

            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
        </article>
    </main>

</body>
</html>
